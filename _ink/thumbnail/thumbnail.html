<head>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap">
<style>

  }
  .strip { display: flex; gap: 14px; font-family: "IBM Plex Mono", ui-monospace, "Cascadia Mono", "Consolas", monospace; font-size: 40px; direction: ltr; min-height: 60px; }
  html[dir="rtl"] .strip { justify-content: flex-end; }
  .strip span { padding: 4px 20px; border-radius: 7px; border: 3px solid #3A3F49; color: #8A909B; }
